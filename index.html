<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura de Números - Cazamisterios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Andika&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFD93D;
            --secondary: #6BCB77;
            --accent: #FF6B6B;
            --sky: #4D96FF;
        }
        
        body {
            font-family: 'Andika', sans-serif;
            background-color: #1a1a1a; 
            background-image: url("fondo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        h1, h2, h3 { font-family: 'Fredoka One', cursive; }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
            min-height: 0;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 6px solid var(--primary);
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            max-height: 98%;
            padding: 1.25rem;
            gap: 0.75rem;
        }

        .btn-bubble {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0px rgba(0,0,0,0.1);
        }
        .btn-bubble:active { transform: translateY(3px); box-shadow: none; }

        .n-key {
            background: var(--sky);
            color: white;
            border-radius: 18px;
            font-size: 1.7rem;
            font-weight: bold;
            box-shadow: 0 5px 0px #3a7bd5;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1.2/1;
        }
        .n-key:active { box-shadow: none; transform: translateY(3px); }
        .n-key.special { background: var(--accent); box-shadow: 0 5px 0px #d45555; }

        .problem-box {
            background: rgba(255, 249, 230, 0.98);
            border-radius: 20px;
            border: 3px dashed #ffcc00;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }
        
        #answerInput {
            font-family: 'Fredoka One', cursive;
            background: #fff;
            border: 4px solid var(--primary);
            color: var(--sky);
            pointer-events: none;
            width: 85px;
            height: 65px;
            border-radius: 18px;
            font-size: 2.2rem;
            text-align: center;
        }

        .visual-aid-container {
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.25rem;
            overflow: hidden;
        }

        .numpad-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            max-width: 280px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            padding: 0.5rem 1rem !important;
        }
        header h1 { color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        body.is-cinema-mode { background-image: none !important; background: #000; }
        body.is-cinema-mode header { display: none; }
        body.is-cinema-mode .game-card { border-radius: 0; max-width: 100vw; height: 100vh; background: white; }

        @media (max-height: 720px) {
            .problem-text { font-size: 1.15rem !important; }
            .game-card { padding: 0.75rem; gap: 0.5rem; }
            .numpad-container { max-width: 240px; }
            .n-key { font-size: 1.4rem; }
            #nextBtn { margin-top: 0.25rem; padding: 0.5rem 1.5rem; font-size: 1rem; }
            #answerInput { height: 55px; width: 75px; font-size: 1.8rem; }
        }

        .config-label {
            @apply flex items-center p-2 bg-white border-2 border-gray-100 rounded-xl cursor-pointer hover:border-yellow-400 hover:bg-yellow-50 transition-all text-[11px] leading-tight text-left;
        }
        .config-label input { @apply mr-2 w-4 h-4 flex-shrink-0; }
        .config-label b { @apply text-blue-600 block mb-0.5; }
    </style>
</head>
<body class="p-0 sm:p-2">

    <button id="exitCinemaBtn" class="hidden fixed top-4 right-4 z-[100] bg-red-500 text-white px-6 py-3 rounded-full font-bold btn-bubble shadow-2xl text-lg">
        VOLVER 🔙
    </button>

    <header class="max-w-full w-full flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🕵️‍♂️</span>
            <div>
                <h1 class="text-xl leading-none">Cazamisterios</h1>
                <p class="font-bold uppercase text-[9px] text-yellow-400 tracking-widest">Aventura de Mates</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="fullscreenToggle" class="bg-white/20 border-2 border-sky-300 p-2 rounded-xl btn-bubble text-xl">📺</button>
            <button id="configToggle" class="bg-white/20 border-2 border-yellow-300 p-2 rounded-xl btn-bubble text-xl">⚙️</button>
            <button id="exitBtn" class="bg-white/20 border-2 border-red-300 p-2 rounded-xl btn-bubble text-xl">❌</button>
        </div>
    </header>

    <!-- Panel de Configuración Mejorado -->
    <div id="configPanel" class="hidden fixed inset-0 z-50 bg-white/98 flex items-center justify-center p-4 backdrop-blur-xl overflow-y-auto">
        <div class="max-w-3xl w-full text-center p-4">
            <h2 class="text-3xl font-bold text-yellow-600 mb-4 uppercase">Ajustes Pedagógicos</h2>
            
            <div class="mb-4 bg-gray-50 p-4 rounded-2xl border-2 border-gray-100 max-w-md mx-auto">
                <label class="block mb-2 font-bold text-xl">Rango Máximo: <span id="rangeLabel" class="text-sky-500">10</span></label>
                <input type="range" id="rangeMax" min="5" max="30" value="10" class="w-full accent-yellow-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Columna Cambio -->
                <div class="bg-blue-50/50 p-4 rounded-3xl border-2 border-blue-100">
                    <h3 class="font-bold text-lg mb-3 text-blue-700">Problemas de CAMBIO</h3>
                    <div class="grid grid-cols-1 gap-2">
                        <label class="config-label"><input type="checkbox" checked value="C1"> <span><b>C1: Ganar (Final)</b> Busca la cantidad resultante tras ganar.</span></label>
                        <label class="config-label"><input type="checkbox" checked value="C2"> <span><b>C2: Perder (Final)</b> Busca la cantidad resultante tras perder.</span></label>
                        <label class="config-label"><input type="checkbox" value="C3"> <span><b>C3: Ganar (Cambio)</b> Busca cuánto se ganó en el recreo.</span></label>
                        <label class="config-label"><input type="checkbox" value="C4"> <span><b>C4: Perder (Cambio)</b> Busca cuánto se perdió en el camino.</span></label>
                        <label class="config-label"><input type="checkbox" value="C5"> <span><b>C5: Ganar (Inicial)</b> Busca cuánto tenía antes de ganar.</span></label>
                        <label class="config-label"><input type="checkbox" value="C6"> <span><b>C6: Perder (Inicial)</b> Busca cuánto tenía antes de perder.</span></label>
                    </div>
                </div>
                <!-- Columna Comparación -->
                <div class="bg-green-50/50 p-4 rounded-3xl border-2 border-green-100">
                    <h3 class="font-bold text-lg mb-3 text-green-700">Problemas de COMPARACIÓN</h3>
                    <div class="grid grid-cols-1 gap-2">
                        <label class="config-label"><input type="checkbox" value="CP1"> <span><b>CP1: Mayoría</b> ¿Cuántos tiene de MÁS el que más tiene?</span></label>
                        <label class="config-label"><input type="checkbox" value="CP2"> <span><b>CP2: Minoría</b> ¿Cuántos tiene de MENOS el que menos tiene?</span></label>
                        <label class="config-label"><input type="checkbox" value="CP3"> <span><b>CP3: Referente (+)</b> Busca al que tiene más (Dado el menos).</span></label>
                        <label class="config-label"><input type="checkbox" value="CP4"> <span><b>CP4: Referente (-)</b> Busca al que tiene menos (Dado el más).</span></label>
                    </div>
                </div>
            </div>

            <button id="closeConfig" class="w-full bg-green-500 text-white font-bold py-5 rounded-3xl btn-bubble shadow-2xl text-2xl uppercase">¡GUARDAR MISIONES! 🚀</button>
        </div>
    </div>

    <div id="exitScreen" class="hidden fixed inset-0 z-[60] bg-sky-600 flex flex-col items-center justify-center p-6 text-white text-center">
        <span class="text-9xl mb-4">🌟</span>
        <h2 class="text-5xl font-bold mb-4">¡Misión Cumplida!</h2>
        <button id="restartBtn" class="bg-white text-sky-600 px-12 py-6 rounded-full text-2xl font-bold btn-bubble">Volver a Jugar</button>
    </div>

    <main>
        <div id="gameCard" class="game-card">
            <div id="visualAid" class="visual-aid-container"></div>

            <div class="problem-box shadow-lg">
                <p id="problemText" class="text-lg md:text-2xl font-bold text-gray-800 leading-tight flex-1 text-center">
                    Preparando pistas...
                </p>
                <button id="speakBtn" class="bg-yellow-400 p-4 rounded-full text-3xl shadow-md border-2 border-white btn-bubble flex-shrink-0">📢</button>
            </div>

            <div class="flex justify-center items-center gap-4">
                <input type="number" id="answerInput" placeholder="?">
                <button id="checkBtn" class="bg-green-500 text-white font-bold h-[65px] px-8 rounded-2xl shadow-lg text-2xl btn-bubble border-b-6 border-green-700">¡LISTO!</button>
            </div>
            
            <div class="numpad-container">
                <button class="n-key">1</button><button class="n-key">2</button><button class="n-key">3</button>
                <button class="n-key">4</button><button class="n-key">5</button><button class="n-key">6</button>
                <button class="n-key">7</button><button class="n-key">8</button><button class="n-key">9</button>
                <button id="keyClear" class="n-key special">C</button>
                <button class="n-key">0</button>
                <button id="keyDel" class="n-key special">←</button>
            </div>
        </div>

        <button id="nextBtn" class="mt-4 bg-sky-500 text-white font-bold px-10 py-4 rounded-full shadow-2xl text-xl btn-bubble border-b-6 border-sky-700">SIGUIENTE CASO 🔍</button>
    </main>

    <script>
        const nombres = ["Hugo", "Sofía", "Lucas", "Elena", "Mateo", "Pilar", "Dani", "Martina", "Leo", "Carla", "Espe", "Laura"];
        const temas = { colegio: { items: ["caramelos", "cromos", "pegatinas", "balones"], icons: ["🍬", "🃏", "⭐", "⚽"] } };
        const frasesAcierto = ["¡Bien!", "¡Enhorabuena!", "¡Fenomenal!", "¡Genio!", "¡Perfecto!", "¡Increíble!"];

        let currentProblem = { type: '', result: 0, fullText: '' };
        const config = { max: 10, types: ['C1', 'C2'], theme: 'colegio' };

        const elements = {
            problemText: document.getElementById('problemText'),
            visualAid: document.getElementById('visualAid'),
            answerInput: document.getElementById('answerInput'),
            configPanel: document.getElementById('configPanel'),
            exitScreen: document.getElementById('exitScreen'),
            gameCard: document.getElementById('gameCard'),
            exitCinemaBtn: document.getElementById('exitCinemaBtn')
        };

        function decir(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                utterance.pitch = 1.2; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function generateProblem() {
            const type = config.types[Math.floor(Math.random() * config.types.length)];
            const theme = temas.colegio;
            const idx = Math.floor(Math.random() * theme.items.length);
            const item = theme.items[idx];
            const icon = theme.icons[idx];
            const p1 = nombres[Math.floor(Math.random() * nombres.length)];
            let p2 = nombres[Math.floor(Math.random() * nombres.length)];
            while(p1 === p2) p2 = nombres[Math.floor(Math.random() * nombres.length)];

            let n1, n2, diff, text, visualData = [];

            // Lógica unificada para Cambio y Comparación
            if (type === 'C1') {
                n1 = Math.floor(Math.random() * (config.max - 1)) + 1;
                diff = Math.floor(Math.random() * (config.max - n1)) + 1;
                currentProblem.result = n1 + diff;
                text = `${p1} tenía ${n1} ${item}. Le regalaron ${diff} más. ¿Cuántos tiene ahora?`;
                visualData = [{icon, n: n1, label: p1}];
            } else if (type === 'C2') {
                n1 = Math.floor(Math.random() * (config.max - 1)) + 2;
                diff = Math.floor(Math.random() * (n1 - 1)) + 1;
                currentProblem.result = n1 - diff;
                text = `${p1} tenía ${n1} ${item}. Perdió ${diff} jugando. ¿Cuántos le quedan?`;
                visualData = [{icon, n: n1, label: p1}];
            } else if (type === 'C3') {
                n1 = Math.floor(Math.random() * (config.max - 2)) + 1;
                let nFinal = Math.floor(Math.random() * (config.max - n1 - 1)) + n1 + 1;
                currentProblem.result = nFinal - n1;
                text = `${p1} tenía ${n1} ${item}. Al final del día tiene ${nFinal}. ¿Cuántos ha ganado hoy?`;
                visualData = [{icon, n: n1, label: p1}];
            } else if (type === 'C4') {
                n1 = Math.floor(Math.random() * (config.max - 2)) + 3;
                let nFinal = Math.floor(Math.random() * (n1 - 2)) + 1;
                currentProblem.result = n1 - nFinal;
                text = `${p1} tenía ${n1} ${item}. Ahora solo tiene ${nFinal}. ¿Cuántos ha perdido?`;
                visualData = [{icon, n: n1, label: p1}];
            } else if (type === 'C5') {
                diff = Math.floor(Math.random() * (config.max - 2)) + 1;
                let nFinal = Math.floor(Math.random() * (config.max - diff - 1)) + diff + 1;
                currentProblem.result = nFinal - diff;
                text = `${p1} tenía unos cuantos ${item}. Ganó ${diff} jugando y ahora tiene ${nFinal}. ¿Cuántos tenía al principio?`;
                visualData = [{icon, n: nFinal, label: p1}];
            } else if (type === 'C6') {
                diff = Math.floor(Math.random() * (config.max / 2)) + 1;
                let nFinal = Math.floor(Math.random() * (config.max / 2)) + 1;
                currentProblem.result = nFinal + diff;
                text = `${p1} tenía varios ${item}. Perdió ${diff} en el patio y ahora le quedan ${nFinal}. ¿Cuántos tenía antes de perderlos?`;
                visualData = [{icon, n: nFinal, label: p1}];
            } else if (type === 'CP1') {
                n1 = Math.floor(Math.random() * (config.max - 2)) + 1;
                n2 = Math.floor(Math.random() * (config.max - n1 - 1)) + n1 + 1;
                currentProblem.result = n2 - n1;
                text = `${p1} tiene ${n1} ${item}. ${p2} tiene ${n2} ${item}. ¿Cuántos tiene ${p2} MÁS que ${p1}?`;
                visualData = [{icon, n: n1, label: p1}, {icon, n: n2, label: p2}];
            } else if (type === 'CP2') {
                n1 = Math.floor(Math.random() * (config.max - 2)) + 1;
                n2 = Math.floor(Math.random() * (config.max - n1 - 1)) + n1 + 1;
                currentProblem.result = n2 - n1;
                text = `${p1} tiene ${n1} ${item}. ${p2} tiene ${n2} ${item}. ¿Cuántos tiene ${p1} MENOS que ${p2}?`;
                visualData = [{icon, n: n1, label: p1}, {icon, n: n2, label: p2}];
            } else if (type === 'CP3') {
                n1 = Math.floor(Math.random() * (config.max / 2)) + 1;
                diff = Math.floor(Math.random() * (config.max - n1 - 1)) + 1;
                currentProblem.result = n1 + diff;
                text = `${p1} tiene ${n1} ${item}. ${p2} tiene ${diff} MÁS que ${p1}. ¿Cuántos tiene ${p2}?`;
                visualData = [{icon, n: n1, label: p1}];
            } else if (type === 'CP4') {
                n2 = Math.floor(Math.random() * (config.max - 2)) + 3;
                diff = Math.floor(Math.random() * (n2 - 1)) + 1;
                currentProblem.result = n2 - diff;
                text = `${p2} tiene ${n2} ${item}. ${p1} tiene ${diff} MENOS que ${p2}. ¿Cuántos tiene ${p1}?`;
                visualData = [{icon, n: n2, label: p2}];
            }

            elements.problemText.innerText = text;
            currentProblem.fullText = text;
            elements.answerInput.value = '';
            
            elements.visualAid.innerHTML = '';
            visualData.forEach(set => {
                const row = document.createElement('div');
                row.className = "flex items-center gap-2";
                const label = document.createElement('span');
                label.className = "text-[10px] font-bold text-gray-500 w-12 text-right";
                label.innerText = set.label;
                row.appendChild(label);
                
                const iconsDiv = document.createElement('div');
                iconsDiv.className = "flex gap-1";
                for(let i=0; i<set.n; i++) {
                    const s = document.createElement('span');
                    s.innerText = set.icon;
                    s.className = "text-xl md:text-2xl";
                    iconsDiv.appendChild(s);
                }
                row.appendChild(iconsDiv);
                elements.visualAid.appendChild(row);
            });
            decir(text);
        }

        function checkAnswer() {
            const userVal = parseInt(elements.answerInput.value);
            if (isNaN(userVal)) return;
            if (userVal === currentProblem.result) {
                decir(frasesAcierto[Math.floor(Math.random() * frasesAcierto.length)]);
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                setTimeout(generateProblem, 2500);
            } else {
                decir("¡Inténtalo de nuevo!");
                elements.answerInput.value = '';
                elements.gameCard.style.animation = 'shake 0.5s';
                setTimeout(() => elements.gameCard.style.animation = '', 500);
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }`;
        document.head.appendChild(style);

        document.getElementById('speakBtn').onclick = () => decir(currentProblem.fullText);
        document.getElementById('nextBtn').onclick = generateProblem;
        document.getElementById('checkBtn').onclick = checkAnswer;
        document.getElementById('fullscreenToggle').onclick = () => { document.body.classList.toggle('is-cinema-mode'); elements.exitCinemaBtn.classList.toggle('hidden'); };
        document.getElementById('exitCinemaBtn').onclick = () => { document.body.classList.remove('is-cinema-mode'); elements.exitCinemaBtn.classList.add('hidden'); };
        document.getElementById('exitBtn').onclick = () => elements.exitScreen.classList.remove('hidden');
        document.getElementById('restartBtn').onclick = () => { elements.exitScreen.classList.add('hidden'); generateProblem(); };
        
        document.querySelectorAll('.n-key').forEach(btn => {
            btn.onclick = () => {
                if (btn.classList.contains('special')) return;
                if(elements.answerInput.value.length < 2) elements.answerInput.value += btn.innerText;
            };
        });
        document.getElementById('keyClear').onclick = () => elements.answerInput.value = '';
        document.getElementById('keyDel').onclick = () => elements.answerInput.value = elements.answerInput.value.slice(0, -1);
        document.getElementById('configToggle').onclick = () => elements.configPanel.classList.toggle('hidden');
        document.getElementById('rangeMax').oninput = (e) => {
            config.max = parseInt(e.target.value);
            document.getElementById('rangeLabel').innerText = config.max;
        };
        document.getElementById('closeConfig').onclick = () => {
            const checked = Array.from(document.querySelectorAll('#configPanel input[type="checkbox"]:checked')).map(el => el.value);
            if (checked.length > 0) config.types = checked;
            elements.configPanel.classList.add('hidden');
            generateProblem();
        };

        window.onload = generateProblem;
    </script>
</body>
</html>
